<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">A부터 F까지의 네트워크 연결</title>
  <desc id="description">모든 링크는 양방향이다. A-B 비용 2, A-D 비용 1, B-D 비용 2, D-C 비용 2, C-E 비용 1, C-F 비용 5, E-F 비용 2. D와 E 사이에는 직접 연결이 없다.</desc>
  <rect width="640" height="360" rx="14" fill="#fff"/>
  <g stroke="#334155" stroke-width="3" fill="none">
    <line data-from="A" data-to="B" data-cost="2" x1="64" y1="168" x2="204" y2="60"/>
    <line data-from="A" data-to="D" data-cost="1" x1="64" y1="168" x2="204" y2="276"/>
    <line data-from="B" data-to="D" data-cost="2" x1="204" y1="60" x2="204" y2="276"/>
    <line data-from="D" data-to="C" data-cost="2" x1="204" y1="276" x2="384" y2="168"/>
    <line data-from="C" data-to="E" data-cost="1" x1="384" y1="168" x2="564" y2="60"/>
    <line data-from="C" data-to="F" data-cost="5" x1="384" y1="168" x2="564" y2="276"/>
    <line data-from="E" data-to="F" data-cost="2" x1="564" y1="60" x2="564" y2="276"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#172033">
    <g><circle cx="134" cy="114" r="18" fill="#fff"/><text x="134" y="123">2</text></g>
    <g><circle cx="134" cy="222" r="18" fill="#fff"/><text x="134" y="231">1</text></g>
    <g><circle cx="204" cy="168" r="18" fill="#fff"/><text x="204" y="177">2</text></g>
    <g><circle cx="294" cy="222" r="18" fill="#fff"/><text x="294" y="231">2</text></g>
    <g><circle cx="474" cy="114" r="18" fill="#fff"/><text x="474" y="123">1</text></g>
    <g><circle cx="474" cy="222" r="18" fill="#fff"/><text x="474" y="231">5</text></g>
    <g><circle cx="564" cy="168" r="18" fill="#fff"/><text x="564" y="177">2</text></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="29" font-weight="600" text-anchor="middle" fill="#172033">
    <g><circle cx="64" cy="168" r="28" fill="#f8fafc" stroke="#273449" stroke-width="3"/><text x="64" y="178">A</text></g>
    <g><circle cx="204" cy="60" r="28" fill="#f8fafc" stroke="#273449" stroke-width="3"/><text x="204" y="70">B</text></g>
    <g><circle cx="204" cy="276" r="28" fill="#f8fafc" stroke="#273449" stroke-width="3"/><text x="204" y="286">D</text></g>
    <g><circle cx="384" cy="168" r="28" fill="#f8fafc" stroke="#273449" stroke-width="3"/><text x="384" y="178">C</text></g>
    <g><circle cx="564" cy="60" r="28" fill="#f8fafc" stroke="#273449" stroke-width="3"/><text x="564" y="70">E</text></g>
    <g><circle cx="564" cy="276" r="28" fill="#f8fafc" stroke="#273449" stroke-width="3"/><text x="564" y="286">F</text></g>
  </g>
  <text x="320" y="340" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="19" text-anchor="middle" fill="#64748b">숫자: 링크 비용 · 모든 연결은 양방향</text>
</svg>
